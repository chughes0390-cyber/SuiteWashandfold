<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuiteWash — Premium Laundry Amenity for Modern Living</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0a1628;
      --cream: #f5f0e8;
      --gold: #c9a84c;
      --gold-light: #e8d5a3;
      --slate: #2d3f5a;
      --mist: #e8edf5;
      --white: #ffffff;
      --text-dark: #0a1628;
      --text-mid: #4a5568;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 3rem;
      background: rgba(10,22,40,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201,168,76,0.15);
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.04em;
    }
    .nav-logo span { color: var(--white); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      color: rgba(255,255,255,0.75);
      text-decoration: none; font-size: 0.875rem;
      letter-spacing: 0.06em; text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--gold); }
    .nav-cta {
      background: var(--gold); color: var(--navy);
      padding: 0.6rem 1.4rem; border-radius: 2px;
      font-weight: 500; font-size: 0.875rem;
      cursor: pointer; border: none;
      letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    .nav-cta:hover { background: var(--gold-light); }

    /* ── HERO ── */
    #landing { display: block; }
    #portal { display: none; }

    .hero {
      min-height: 100vh;
      background: var(--navy);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      position: relative;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 70% 50%, rgba(201,168,76,0.08) 0%, transparent 60%);
    }
    .hero-left {
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 8rem 4rem 6rem 6rem;
      position: relative; z-index: 2;
    }
    .hero-eyebrow {
      font-size: 0.75rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 1.5rem;
    }
    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 5vw, 4.5rem);
      font-weight: 900; line-height: 1.05;
