<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SuiteWash Staff — Operations</title>
<meta name="robots" content="noindex, nofollow"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#080f1e;--ink2:#111827;--ink3:#1a2535;--ink4:#243044;
  --cream:#f7f3ec;--gold:#c9a84c;--gold2:#e8d5a3;
  --white:#fff;--mid:#6b7280;--lt:#9ca3af;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;
  --sh:0 2px 16px rgba(8,15,30,.18);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:var(--ink);color:var(--white);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}

/* ── AUTH SCREEN ── */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;}
.auth-box{background:var(--ink2);border:1px solid rgba(201,168,76,.2);border-radius:14px;padding:2rem 1.6rem;width:100%;max-width:360px;box-shadow:var(--sh);}
.auth-logo{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.3rem;}
.auth-logo b{color:var(--gold);}
.auth-sub{font-size:.75rem;color:var(--mid);margin-bottom:1.6rem;}
.ag{margin-bottom:.9rem;}
.ag label{display:block;font-size:.68rem;font-weight:600;color:var(--lt);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem;}
.ag input{width:100%;background:var(--ink3);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:.6rem .8rem;color:var(--white);font-size:.85rem;outline:none;transition:border-color .15s;}
.ag input:focus{border-color:rgba(201,168,76,.5);}
.auth-btn{width:100%;background:var(--gold);color:var(--ink);font-weight:700;font-size:.9rem;padding:.72rem;border:none;border-radius:8px;margin-top:.4rem;transition:opacity .15s;}
.auth-btn:hover{opacity:.88;}
.auth-err{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:6px;padding:.5rem .75rem;font-size:.72rem;color:#fca5a5;margin-bottom:.7rem;}

/* ── APP SHELL ── */
#app{display:none;}
.topbar{background:var(--ink2);border-bottom:1px solid rgba(255,255,255,.06);padding:.75rem 1.2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.tb-logo{font-size:1.1rem;font-weight:800;}
.tb-logo b{color:var(--gold);}
.tb-user{font-size:.72rem;color:var(--mid);}
.tb-right{display:flex;align-items:center;gap:.8rem;}
.signout-btn{background:none;border:1px solid rgba(255,255,255,.1);color:var(--lt);font-size:.7rem;padding:.3rem .7rem;border-radius:5px;}
.signout-btn:hover{border-color:rgba(201,168,76,.4);color:var(--gold);}

/* ── TABS ── */
.tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.06);background:var(--ink2);padding:0 1.2rem;}
.tab{padding:.75rem 1rem;font-size:.78rem;font-weight:600;color:var(--mid);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);}

/* ── PANELS ── */
.panel{display:none;padding:1.2rem;}
.panel.on{display:block;}

/* ── STAT CARDS ── */
.stat-row{display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:1.4rem;}
.stat{flex:1;min-width:120px;background:var(--ink2);border-radius:10px;padding:1rem;border:1px solid rgba(255,255,255,.06);}
.stat-n{font-size:1.8rem;font-weight:900;color:var(--gold);line-height:1;}
.stat-l{font-size:.65rem;color:var(--mid);margin-top:.25rem;font-weight:500;}

/* ── SECTION HEADERS ── */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;}
.sec-hd h3{font-size:.88rem;font-weight:700;}
.sec-hd p{font-size:.7rem;color:var(--mid);}

/* ── DATE NAV ── */
.date-nav{display:flex;align-items:center;gap:.6rem;margin-bottom:1.1rem;}
.date-nav button{background:var(--ink3);border:1px solid rgba(255,255,255,.08);color:var(--white);padding:.35rem .65rem;border-radius:6px;font-size:.8rem;}
.date-nav button:hover{border-color:rgba(201,168,76,.4);}
.date-label{font-size:.88rem;font-weight:700;flex:1;text-align:center;}
.date-badge{font-size:.65rem;color:var(--mid);}

/* ── PICKUP CARDS ── */
.pickup-list{display:flex;flex-direction:column;gap:.7rem;}
.pickup-card{background:var(--ink2);border-radius:10px;padding:1rem;border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:.55rem;}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;}
.pc-name{font-size:.88rem;font-weight:700;}
.pc-unit{font-size:.7rem;color:var(--mid);}
.pc-plan{font-size:.62rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;background:rgba(201,168,76,.15);color:var(--gold);}
.pc-notes{font-size:.72rem;color:var(--gold2);background:rgba(201,168,76,.07);border-radius:5px;padding:.4rem .6rem;}
.pc-meta{display:flex;flex-wrap:wrap;gap:.4rem;font-size:.65rem;color:var(--mid);}
.pc-actions{display:flex;gap:.5rem;flex-wrap:wrap;}
.status-btn{flex:1;min-width:80px;font-size:.68rem;font-weight:700;padding:.4rem .5rem;border-radius:6px;border:none;transition:opacity .15s;}
.status-btn:hover{opacity:.85;}
.status-btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-pickup{background:#1d4ed8;color:#fff;}
.btn-process{background:#d97706;color:#fff;}
.btn-deliver{background:#16a34a;color:#fff;}
.btn-miss{background:#7f1d1d;color:#fca5a5;}

/* ── STATUS BADGES ── */
.badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.62rem;font-weight:700;padding:.2rem .55rem;border-radius:5px;text-transform:uppercase;letter-spacing:.04em;}
.b-scheduled{background:rgba(59,130,246,.15);color:#93c5fd;}
.b-picked_up{background:rgba(245,158,11,.15);color:#fcd34d;}
.b-processing{background:rgba(249,115,22,.15);color:#fed7aa;}
.b-delivered{background:rgba(34,197,94,.15);color:#86efac;}
.b-missed{background:rgba(239,68,68,.15);color:#fca5a5;}

/* ── RESIDENT TABLE ── */
.res-table{width:100%;border-collapse:collapse;font-size:.76rem;}
.res-table th{text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mid);padding:.55rem .7rem;border-bottom:1px solid rgba(255,255,255,.06);}
.res-table td{padding:.65rem .7rem;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top;}
.res-table tr:hover td{background:rgba(255,255,255,.02);}
.plan-tag{font-size:.6rem;font-weight:700;padding:.15rem .45rem;border-radius:4px;}
.pt-ess{background:rgba(107,114,128,.2);color:var(--lt);}
.pt-com{background:rgba(201,168,76,.15);color:var(--gold);}
.pt-suite{background:rgba(139,92,246,.15);color:#c4b5fd;}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:.3rem;}
.sd-active{background:var(--green);}
.sd-pending{background:var(--amber);}
.sd-cancelled{background:var(--red);}
.sd-past_due{background:#f97316;}

/* ── WEEK CALENDAR ── */
.week-grid{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.5rem;}
.wday{flex:0 0 120px;background:var(--ink2);border-radius:10px;padding:.8rem;border:1px solid rgba(255,255,255,.06);}
.wday.today{border-color:rgba(201,168,76,.4);}
.wday-hd{font-size:.7rem;font-weight:700;margin-bottom:.15rem;}
.wday-date{font-size:.62rem;color:var(--mid);margin-bottom:.55rem;}
.wday-count{font-size:1.4rem;font-weight:900;color:var(--gold);line-height:1;}
.wday-cap{font-size:.6rem;color:var(--mid);margin-top:.1rem;}
.wday-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:.5rem;overflow:hidden;}
.wday-fill{height:100%;background:var(--gold);transition:width .3s;}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:2.5rem 1rem;}
.empty p{font-size:.8rem;color:var(--mid);}

/* ── LOADING ── */
.loading{text-align:center;padding:2rem;color:var(--mid);font-size:.8rem;}

/* ── TOAST ── */
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--ink3);border:1px solid rgba(201,168,76,.3);color:var(--cream);padding:.6rem 1.2rem;border-radius:8px;font-size:.78rem;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ── AUTH ── -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">Suite<b>Wash</b></div>
    <p class="auth-sub">Staff Operations Dashboard</p>
    <div class="auth-err" id="auth-err"></div>
    <div class="ag"><label>Email</label><input type="email" id="s-email" placeholder="your@email.com" autocomplete="email"/></div>
    <div class="ag"><label>Password</label><input type="password" id="s-pass" placeholder="••••••••" autocomplete="current-password"/></div>
    <button class="auth-btn" onclick="staffSignIn()">Sign In to Staff Panel</button>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <div class="topbar">
    <div class="tb-logo">Suite<b>Wash</b> <span style="font-size:.65rem;font-weight:500;color:var(--mid);margin-left:.3rem;">Staff</span></div>
    <div class="tb-right">
      <span class="tb-user" id="tb-user"></span>
      <button class="signout-btn" onclick="staffSignOut()">Sign Out</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" onclick="switchTab('today',this)">Today's Pickups</div>
    <div class="tab" onclick="switchTab('week',this)">Week View</div>
    <div class="tab" onclick="switchTab('residents',this)">Residents</div>
  </div>

  <!-- TODAY -->
  <div class="panel on" id="panel-today">
    <div class="stat-row" id="today-stats"></div>
    <div class="date-nav">
      <button onclick="changeDate(-1)">‹</button>
      <div style="flex:1;text-align:center;">
        <div class="date-label" id="date-label">—</div>
        <div class="date-badge" id="date-badge"></div>
      </div>
      <button onclick="changeDate(1)">›</button>
    </div>
    <div id="today-list"><div class="loading">Loading pickups…</div></div>
  </div>

  <!-- WEEK -->
  <div class="panel" id="panel-week">
    <div class="sec-hd"><h3>This Week's Schedule</h3><p id="week-range"></p></div>
    <div class="week-grid" id="week-grid"></div>
    <div style="margin-top:1.4rem;">
      <div class="sec-hd"><h3>All Upcoming Pickups</h3></div>
      <div id="upcoming-list"><div class="loading">Loading…</div></div>
    </div>
  </div>

  <!-- RESIDENTS -->
  <div class="panel" id="panel-residents">
    <div class="stat-row" id="res-stats"></div>
    <div class="sec-hd">
      <h3>All Residents</h3>
      <div style="display:flex;gap:.5rem;">
        <select id="res-filter" onchange="filterResidents()" style="background:var(--ink3);border:1px solid rgba(255,255,255,.08);color:var(--white);font-size:.7rem;padding:.3rem .5rem;border-radius:5px;">
          <option value="all">All plans</option>
          <option value="ess">Essential</option>
          <option value="com">Comfort</option>
          <option value="suite">Suite</option>
        </select>
        <select id="status-filter" onchange="filterResidents()" style="background:var(--ink3);border:1px solid rgba(255,255,255,.08);color:var(--white);font-size:.7rem;padding:.3rem .5rem;border-radius:5px;">
          <option value="all">All statuses</option>
          <option value="active">Active</option>
          <option value="pending_payment">Pending</option>
          <option value="past_due">Past Due</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table class="res-table">
        <thead><tr><th>Resident</th><th>Plan</th><th>Status</th><th>Pickups</th><th>Next Billing</th><th>Building</th></tr></thead>
        <tbody id="res-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── XSS PROTECTION ──
// All user-controlled database strings must pass through esc() before
// being interpolated into innerHTML template literals.
function esc(str){
  if(!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

const SUPABASE_URL = 'https://eajxwgwwupwpcfxepasr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hPL9QAbrWxjK700WFTqwQA_cnDmqFK4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DAILY_CAP = 12;
const SERVICE_DAYS = [1,3,5]; // Mon, Wed, Fri
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PLAN_LABELS = {ess:'Essential',com:'Comfort',suite:'Suite'};

let currentDate = new Date();
let allResidents = [];
let currentUser = null;

// ── AUTH ──
async function staffSignIn(){
  const email = document.getElementById('s-email').value.trim();
  const pass  = document.getElementById('s-pass').value;
  const err   = document.getElementById('auth-err');
  err.style.display = 'none';

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ err.textContent = error.message; err.style.display = 'block'; return; }

  // Verify this user is actually in the staff table
  const { data: staffRow } = await sb.from('staff').select('id,name,role').eq('id', data.user.id).maybeSingle();
  if(!staffRow){
    await sb.auth.signOut();
    err.textContent = 'Access denied — this dashboard is for SuiteWash staff only.';
    err.style.display = 'block';
    return;
  }

  currentUser = { ...data.user, name: staffRow.name, role: staffRow.role };
  showApp();
}

async function staffSignOut(){
  await sb.auth.signOut();
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  currentUser = null;
}

async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return;
  const { data: staffRow } = await sb.from('staff').select('id,name,role').eq('id', session.user.id).maybeSingle();
  if(!staffRow) return;
  currentUser = { ...session.user, name: staffRow.name, role: staffRow.role };
  showApp();
}

function showApp(){
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('tb-user').textContent = currentUser.name || currentUser.email;
  currentDate = new Date();
  loadToday();
  loadWeek();
  loadResidents();
}

// ── TABS ──
function switchTab(name, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('panel-'+name).classList.add('on');
}

// ── DATE NAV ──
function changeDate(delta){
  currentDate.setDate(currentDate.getDate() + delta);
  loadToday();
}

function fmtDate(d){
  return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}

function toDateStr(d){
  return d.toISOString().slice(0,10);
}

// ── TODAY'S PICKUPS ──
async function loadToday(){
  const ds = toDateStr(currentDate);
  const today = toDateStr(new Date());

  document.getElementById('date-label').textContent = fmtDate(currentDate);
  const isToday = ds === today;
  const isSvcDay = SERVICE_DAYS.includes(currentDate.getDay());
  document.getElementById('date-badge').textContent =
    isToday ? '● Today' : isSvcDay ? 'Service Day' : 'No Service';

  const list = document.getElementById('today-list');
  list.innerHTML = '<div class="loading">Loading…</div>';

  const { data: pickups, error } = await sb
    .from('pickups')
    .select('*, residents(first_name, last_name, unit, building, plan, wash_preference, scent_preference, special_instructions)')
    .eq('scheduled_date', ds)
    .order('status');

  if(error){ list.innerHTML = `<div class="empty"><p>Error: ${error.message}</p></div>`; return; }

  // Stats
  const stats = {
    total: pickups.length,
    scheduled: pickups.filter(p=>p.status==='scheduled').length,
    picked_up: pickups.filter(p=>p.status==='picked_up').length,
    delivered: pickups.filter(p=>p.status==='delivered').length,
  };
  document.getElementById('today-stats').innerHTML = `
    <div class="stat"><div class="stat-n">${stats.total}</div><div class="stat-l">Total pickups</div></div>
    <div class="stat"><div class="stat-n" style="color:#93c5fd">${stats.scheduled}</div><div class="stat-l">Scheduled</div></div>
    <div class="stat"><div class="stat-n" style="color:#fcd34d">${stats.picked_up}</div><div class="stat-l">Picked up</div></div>
    <div class="stat"><div class="stat-n" style="color:#86efac">${stats.delivered}</div><div class="stat-l">Delivered</div></div>
  `;

  if(!pickups.length){
    list.innerHTML = `<div class="empty"><p>${isSvcDay ? 'No pickups scheduled for this day yet.' : 'No service on this day (Mon/Wed/Fri only).'}</p></div>`;
    return;
  }

  list.innerHTML = pickups.map(p => {
    const r = p.residents || {};
    const name = `${esc(r.first_name)||''} ${esc(r.last_name)||''}`.trim() || 'Unknown';
    const planLabel = PLAN_LABELS[r.plan] || esc(r.plan);
    const notes = esc(r.special_instructions || '');
    const washPref = esc(r.wash_preference || '');
    const scentPref = esc(r.scent_preference || '');

    const nextStatus = {scheduled:'picked_up', picked_up:'processing', processing:'delivered'}[p.status];
    const btnLabel = {scheduled:'Mark Picked Up', picked_up:'Mark Processing', processing:'Mark Delivered'}[p.status];
    const btnClass = {scheduled:'btn-pickup', picked_up:'btn-process', processing:'btn-deliver'}[p.status];
    const isDone = p.status === 'delivered' || p.status === 'missed';

    return `<div class="pickup-card" id="card-${p.id}">
      <div class="pc-top">
        <div>
          <div class="pc-name">${name}</div>
          <div class="pc-unit">Unit ${esc(r.unit)||'—'} · ${esc(r.building)||'—'}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;">
          <span class="pc-plan">${planLabel}</span>
          <span class="badge b-${p.status}">${p.status.replace('_',' ')}</span>
        </div>
      </div>
      ${notes ? `<div class="pc-notes">📝 ${notes}</div>` : ''}
      <div class="pc-meta">
        ${washPref ? `<span>🧺 ${washPref}</span>` : ''}
        ${scentPref ? `<span>🌸 ${scentPref}</span>` : ''}
        ${p.weight_lbs ? `<span>⚖️ ${p.weight_lbs} lbs</span>` : ''}
      </div>
      ${!isDone ? `<div class="pc-actions">
        <button class="status-btn ${btnClass}" onclick="updatePickupStatus('${p.id}','${nextStatus}',this)">${btnLabel}</button>
        <button class="status-btn btn-miss" onclick="updatePickupStatus('${p.id}','missed',this)">Mark Missed</button>
      </div>` : ''}
    </div>`;
  }).join('');
}

async function updatePickupStatus(id, newStatus, btn){
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Saving…';

  const updates = { status: newStatus };
  if(newStatus === 'delivered') updates.delivered_at = new Date().toISOString();

  const { error } = await sb.from('pickups').update(updates).eq('id', id);

  if(error){
    btn.disabled = false;
    btn.textContent = original;
    showToast('Update failed: ' + error.message, true);
    return;
  }

  showToast(newStatus === 'delivered' ? '✓ Marked delivered' : newStatus === 'missed' ? '⚠ Marked missed' : '✓ Status updated');
  await loadToday();
}

// ── WEEK VIEW ──
async function loadWeek(){
  const today = new Date();
  // Get Monday of current week
  const monday = new Date(today);
  monday.setDate(today.getDate() - (today.getDay() === 0 ? 6 : today.getDay() - 1));

  const days = Array.from({length:7}, (_,i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });

  document.getElementById('week-range').textContent =
    `${days[0].toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${days[6].toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;

  const dateStrs = days.map(d => toDateStr(d));
  const { data: pickups } = await sb
    .from('pickups')
    .select('scheduled_date, status, resident_id')
    .in('scheduled_date', dateStrs);

  const countByDate = {};
  (pickups||[]).forEach(p => {
    if(!countByDate[p.scheduled_date]) countByDate[p.scheduled_date] = {total:0,delivered:0};
    countByDate[p.scheduled_date].total++;
    if(p.status==='delivered') countByDate[p.scheduled_date].delivered++;
  });

  const todayStr = toDateStr(today);
  document.getElementById('week-grid').innerHTML = days.map(d => {
    const ds = toDateStr(d);
    const isSvc = SERVICE_DAYS.includes(d.getDay());
    const isToday = ds === todayStr;
    const c = countByDate[ds] || {total:0,delivered:0};
    const pct = isSvc ? Math.round(c.total/DAILY_CAP*100) : 0;
    return `<div class="wday${isToday?' today':''}">
      <div class="wday-hd">${DAY_NAMES[d.getDay()]}</div>
      <div class="wday-date">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
      ${isSvc ? `
        <div class="wday-count">${c.total}</div>
        <div class="wday-cap">of ${DAILY_CAP} · ${c.delivered} done</div>
        <div class="wday-bar"><div class="wday-fill" style="width:${pct}%"></div></div>
      ` : `<div style="font-size:.65rem;color:var(--mid);margin-top:.3rem;">No service</div>`}
    </div>`;
  }).join('');

  // Upcoming pickups list
  const upcoming = (pickups||[])
    .filter(p => p.scheduled_date >= todayStr && p.status === 'scheduled')
    .sort((a,b) => a.scheduled_date.localeCompare(b.scheduled_date));

  const { data: fullPickups } = await sb
    .from('pickups')
    .select('*, residents(first_name, last_name, unit, building, plan)')
    .in('scheduled_date', dateStrs)
    .eq('status','scheduled')
    .gte('scheduled_date', todayStr)
    .order('scheduled_date');

  const ul = document.getElementById('upcoming-list');
  if(!fullPickups || !fullPickups.length){
    ul.innerHTML = '<div class="empty"><p>No upcoming scheduled pickups this week.</p></div>';
    return;
  }
  ul.innerHTML = fullPickups.map(p => {
    const r = p.residents || {};
    const name = `${esc(r.first_name)||''} ${esc(r.last_name)||''}`.trim();
    const d = new Date(p.scheduled_date + 'T12:00:00');
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:.6rem .8rem;background:var(--ink2);border-radius:8px;margin-bottom:.5rem;font-size:.76rem;">
      <div>
        <span style="font-weight:700;">${name}</span>
        <span style="color:var(--mid);margin-left:.4rem;">Unit ${esc(r.unit)||'—'}</span>
      </div>
      <div style="display:flex;align-items:center;gap:.5rem;">
        <span class="plan-tag pt-${r.plan}">${PLAN_LABELS[r.plan]||r.plan}</span>
        <span style="color:var(--gold);font-size:.7rem;">${DAY_NAMES[d.getDay()]} ${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>
      </div>
    </div>`;
  }).join('');
}

// ── RESIDENTS ──
async function loadResidents(){
  const { data: residents, error } = await sb
    .from('residents')
    .select('*')
    .order('created_at', {ascending:false});

  if(error){ return; }
  allResidents = residents || [];

  const active = allResidents.filter(r=>r.plan_status==='active').length;
  const pending = allResidents.filter(r=>r.plan_status==='pending_payment').length;
  const pastDue = allResidents.filter(r=>r.plan_status==='past_due').length;
  const mrr = allResidents
    .filter(r=>r.plan_status==='active')
    .reduce((s,r)=>s+({ess:59.99,com:89.99,suite:119.99}[r.plan]||0),0);

  document.getElementById('res-stats').innerHTML = `
    <div class="stat"><div class="stat-n">${allResidents.length}</div><div class="stat-l">Total residents</div></div>
    <div class="stat"><div class="stat-n" style="color:#86efac">${active}</div><div class="stat-l">Active</div></div>
    <div class="stat"><div class="stat-n" style="color:#fcd34d">${pending}</div><div class="stat-l">Pending payment</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--gold)">$${mrr.toFixed(0)}</div><div class="stat-l">Monthly revenue</div></div>
  `;

  renderResidents();
}

function filterResidents(){
  renderResidents();
}

function renderResidents(){
  const planFilter = document.getElementById('res-filter').value;
  const statusFilter = document.getElementById('status-filter').value;

  let filtered = allResidents;
  if(planFilter !== 'all') filtered = filtered.filter(r=>r.plan===planFilter);
  if(statusFilter !== 'all') filtered = filtered.filter(r=>r.plan_status===statusFilter);

  const tbody = document.getElementById('res-tbody');
  if(!filtered.length){
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:1.5rem;color:var(--mid);font-size:.75rem;">No residents match this filter.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(r => {
    const name = `${esc(r.first_name)||''} ${esc(r.last_name)||''}`.trim() || 'Unknown';
    const statusDot = `<span class="status-dot sd-${r.plan_status}"></span>`;
    const statusText = {active:'Active',pending_payment:'Pending',past_due:'Past Due',cancelled:'Cancelled',paused:'Paused'}[r.plan_status] || esc(r.plan_status);
    const billing = r.next_billing_date ? new Date(r.next_billing_date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '—';
    const pickups = `${r.pickups_used_this_cycle||0} / ${r.pickups_limit||4}`;
    return `<tr>
      <td>
        <div style="font-weight:600;">${name}</div>
        <div style="font-size:.65rem;color:var(--mid);">${esc(r.email)}</div>
      </td>
      <td><span class="plan-tag pt-${r.plan}">${PLAN_LABELS[r.plan]||esc(r.plan)||'—'}</span></td>
      <td>${statusDot}${statusText}</td>
      <td>${pickups}</td>
      <td>${billing}</td>
      <td style="font-size:.7rem;color:var(--mid);">${esc(r.building)||'—'}</td>
    </tr>`;
  }).join('');
}

// ── TOAST ──
function showToast(msg, isError=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'rgba(127,29,29,.9)' : 'var(--ink3)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ── INIT ──
checkSession();
</script>
